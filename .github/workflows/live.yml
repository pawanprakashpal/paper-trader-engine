# Live PAPER day trading for one session. Press "Run workflow" (web or GitHub mobile app), pick the market.
# Start it from 06:30 IST (NSE) or 07:00 ET (US) onward; it waits for the open. It never places real orders.
# A session is longer than GitHub's 6-hour job limit, so it runs as two jobs; the second picks up the first's state.
name: live-paper-day-trading
on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market"
        type: choice
        options: [india, us]
        default: india
      check_only:
        description: "Only test the setup (login + Telegram), don't trade"
        type: boolean
        default: false
concurrency:
  group: live-${{ inputs.market }}-${{ inputs.check_only }}   # a setup check never waits behind a running session
  cancel-in-progress: false
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: "1"
  LIVE_OUT: out
  ANGEL_HIST_API_KEY: ${{ secrets.ANGEL_HIST_API_KEY }}
  ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
  ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
  ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
  ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
  ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  FTP_HOST: ${{ secrets.FTP_HOST }}
  FTP_USER: ${{ secrets.FTP_USER }}
  FTP_PASS: ${{ secrets.FTP_PASS }}
  FTP_DIR: ${{ secrets.FTP_DIR }}
  CAPITAL_INDIA: ${{ secrets.CAPITAL_INDIA }}
  PER_TRADE_INDIA: ${{ secrets.PER_TRADE_INDIA }}
  MAX_TRADES_INDIA: ${{ secrets.MAX_TRADES_INDIA }}
  CAPITAL_US: ${{ secrets.CAPITAL_US }}
  PER_TRADE_US: ${{ secrets.PER_TRADE_US }}
  MAX_TRADES_US: ${{ secrets.MAX_TRADES_US }}
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests
      - name: Setup check (login + Telegram test message)
        if: inputs.check_only
        run: python engine.py ${{ inputs.market }} --check
      - name: Trade until midday (paper)
        if: ${{ !inputs.check_only }}
        run: python engine.py ${{ inputs.market }} --watch --until ${{ inputs.market == 'india' && '12:15' || '12:45' }}
      - name: Hand state to the afternoon job (no credentials or session tokens inside)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: state
          path: state/
          retention-days: 1
          if-no-files-found: ignore
  afternoon:
    needs: morning
    if: ${{ !inputs.check_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: state
          path: state/
      - name: Trade until square-off (paper)
        run: python engine.py ${{ inputs.market }} --watch --continue
