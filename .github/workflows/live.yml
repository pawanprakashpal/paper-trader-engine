# Live PAPER day trading for one session. It never places real orders.
# Starts automatically on weekdays (schedule below), or press "Run workflow" (web or GitHub mobile app) and pick the
# market; a manual run can start from 06:30 IST (NSE) or 07:00 ET (US) and waits for the open.
# A session is longer than GitHub's 6-hour job limit, so it runs as two jobs; the second picks up the first's state.
name: live-paper-day-trading
on:
  schedule:
    - cron: "15 1 * * 1-5"    # NSE: 06:45 IST, Mon-Fri
    - cron: "5 12 * * 1-5"    # US: 08:05 EDT / 07:05 EST, Mon-Fri
  workflow_dispatch:
    inputs:
      market:
        description: "Market"
        type: choice
        options: [india, us]
        default: india
      check_only:
        description: "Only test the setup (login + Telegram), don't trade"
        type: boolean
        default: false
concurrency:
  # one session per market at a time (scheduled and manual share it); a setup check never waits behind a session
  group: live-${{ inputs.market || (github.event.schedule == '15 1 * * 1-5' && 'india' || 'us') }}-${{ inputs.check_only || false }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  MARKET: ${{ inputs.market || (github.event.schedule == '15 1 * * 1-5' && 'india' || 'us') }}
  PYTHONUNBUFFERED: "1"
  LIVE_OUT: out
  ANGEL_HIST_API_KEY: ${{ secrets.ANGEL_HIST_API_KEY }}
  ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
  ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
  ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
  ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
  ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  FTP_HOST: ${{ secrets.FTP_HOST }}
  FTP_USER: ${{ secrets.FTP_USER }}
  FTP_PASS: ${{ secrets.FTP_PASS }}
  FTP_DIR: ${{ secrets.FTP_DIR }}
  CAPITAL_INDIA: ${{ secrets.CAPITAL_INDIA }}
  PER_TRADE_INDIA: ${{ secrets.PER_TRADE_INDIA }}
  MAX_TRADES_INDIA: ${{ secrets.MAX_TRADES_INDIA }}
  CAPITAL_US: ${{ secrets.CAPITAL_US }}
  PER_TRADE_US: ${{ secrets.PER_TRADE_US }}
  MAX_TRADES_US: ${{ secrets.MAX_TRADES_US }}
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests
      - name: Setup check (login + Telegram test message)
        if: ${{ inputs.check_only }}
        run: python engine.py "$MARKET" --check
      - name: Trade until midday (paper)
        if: ${{ !inputs.check_only }}
        run: |
          if [ "$MARKET" = us ] && [ -z "$ALPACA_KEY_ID" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "Alpaca keys not set yet; skipping the scheduled US session."; exit 0
          fi
          [ "$MARKET" = india ] && UNTIL=12:15 || UNTIL=12:45
          python engine.py "$MARKET" --watch --until "$UNTIL"
      - name: Hand state to the afternoon job (no credentials or session tokens inside)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: state
          path: state/
          retention-days: 1
          if-no-files-found: ignore
  afternoon:
    needs: morning
    if: ${{ !inputs.check_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: state
          path: state/
      - name: Trade until square-off (paper)
        run: |
          if [ "$MARKET" = us ] && [ -z "$ALPACA_KEY_ID" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "Alpaca keys not set yet; skipping the scheduled US session."; exit 0
          fi
          python engine.py "$MARKET" --watch --continue
